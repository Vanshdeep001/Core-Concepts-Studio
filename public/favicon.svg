<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <rect width="64" height="64" fill="#ffd93d" />
  
  <!-- Left card (Cyan 'C') -->
  <rect x="7" y="21" width="24" height="24" fill="#000" rx="2.5" />
  <rect x="4" y="18" width="24" height="24" fill="#66d9ef" stroke="#000" stroke-width="2.5" rx="2.5" />
  <text x="16" y="30" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="18" text-anchor="middle" dominant-baseline="central" fill="#000">C</text>
  
  <!-- Right card (Pink 'S') -->
  <rect x="36" y="21" width="24" height="24" fill="#000" rx="2.5" />
  <rect x="33" y="18" width="24" height="24" fill="#ff6b9d" stroke="#000" stroke-width="2.5" rx="2.5" />
  <text x="45" y="30" font-family="system-ui, -apple-system, sans-serif" font-weight="900" font-size="18" text-anchor="middle" dominant-baseline="central" fill="#000">S</text>
</svg>
